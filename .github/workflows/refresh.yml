name: Refresh gamma data
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gamma_refresh.py
      - name: Commit data
        run: |
          git config user.name "gamma-bot"
          git config user.email "gamma-bot@users.noreply.github.com"
          git add gamma-data.json
          git diff --cached --quiet || (git commit -m "Update gamma data" && git push)
